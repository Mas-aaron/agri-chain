buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // MindSpore Lite AAR — needed by the mindspore_lite_flutter plugin
        flatDir {
            dirs rootProject.file('../../mindspore_lite_flutter/android/libs')
        }
    }
}


// Some older Flutter plugins (e.g. flutter_bluetooth_serial) still rely on the
// AndroidManifest.xml package attribute and do not set the AGP 8+ `namespace`
// field. Inject it here to keep builds working without patching pub cache.
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileSdkVersion 36
            }
        }
        if (subproject.name == 'flutter_bluetooth_serial') {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null && androidExt.hasProperty('namespace') && androidExt.namespace == null) {
                androidExt.namespace = 'io.github.edufolly.flutterbluetoothserial'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.agri_chain"

    ndkVersion "27.0.12077973"
    
    // Use compileSdk 36 as required by plugins
    compileSdk 36
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.example.agri_chain"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36  // Update to 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // ndk {
        //     // Nokia G21 is ARM-only; remove x86_64 to avoid packaging large ARM-incompatible libs
        //     abiFilters 'armeabi-v7a', 'arm64-v8a'
        // }
    }
    
    buildTypes {
        release {
            // Use debug keys so you don't need a keystore file yet
            signingConfig signingConfigs.debug 
            
            // ADD THESE THREE LINES for lightweight builds:
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-mindspore.pro'

        }
    }


    // Add this if you're using ViewBinding or DataBinding
    buildFeatures {
        buildConfig true
    }
}

flutter {
    source = "../.."
}

dependencies {
    // TFLite removed — replaced by MindSpore Lite (mindspore_lite_flutter plugin)
    // The .so files are included via plugin jniLibs/arm64-v8a/
}

services:
  # Yield Prediction Engine (FastAPI - internal)
  yield-engine:
    build:
      context: ../../../backend/backend
    environment:
      - CORS_ORIGINS=*
      - AGRICHAIN_DB_PATH=/app/data/agrichain.db
    volumes:
      - yield_data:/app/data
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: agriyield
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      IPFS_PROFILE: server

  # ML Integration Service
  ml-integration:
    build: ./ml-integration
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-admin123}@postgres:5432/agriyield
      REDIS_URL: redis://redis:6379
      IPFS_ENDPOINT: /ip4/ipfs/tcp/5001
      BCS_INSTANCE_ID: ${BCS_INSTANCE_ID:-test-instance}
      BCS_ACCESS_KEY: ${BCS_ACCESS_KEY}
      BCS_SECRET_KEY: ${BCS_SECRET_KEY}
      ETHEREUM_RPC: ${ETHEREUM_RPC:-http://localhost:8545}
      ML_MODEL_ENDPOINT: http://yield-engine:8000/predict
      MODEL_VERSION: ${MODEL_VERSION:-agrichain-maize-v1}
    depends_on:
      yield-engine:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ipfs:
        condition: service_started
    volumes:
      - ./ml-integration:/app

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  yield_data:
  postgres_data:
  redis_data:
  ipfs_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:

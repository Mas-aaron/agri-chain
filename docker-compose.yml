services:
  ml:
    build:
      context: ./backend/backend
    ports:
      - "8001:8001"
    environment:
      # Keep the ML service internal port at 8001
      - PORT=8001
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - ./backend/backend/data:/app/data
    restart: unless-stopped

  gateway:
    build:
      context: ./agri-chain/server
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # Use Docker DNS to reach the ML service.
      - ML_BASE_URL=http://ml:8001
      # Inside the container we always point at the mounted secrets file.
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/firebase-service-account.json
      # Inside the container we store the DB in /data
      - SQLITE_PATH=/data/agrichain.db
    volumes:
      - ./data:/data
      # Mount Firebase service account JSON from host.
      # On Windows, set FIREBASE_CREDENTIALS_PATH in .env to an absolute path.
      - ${FIREBASE_CREDENTIALS_PATH}:/secrets/firebase-service-account.json:ro
    depends_on:
      - ml
    restart: unless-stopped

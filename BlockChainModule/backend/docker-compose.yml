version: '3.8'
services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ETHEREUM_RPC_URL=http://geth:8545
      - PRIVATE_KEY=${PRIVATE_KEY}
    depends_on:
      - geth
  geth:
    image: trufflesuite/ganache:latest
    command: --networkId 1337 -p 8545 -h 0.0.0.0 --deterministic
    ports:
      - "8545:8545"
    volumes:
      - ./data/ganache:/data
